# Server service values
replicaCount: 1
image:
  repository: prograimmer/server
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3500

config: |
  {
    "environment": "development",
    "server": {
      "bodyParserLimits": {
        "json": "5mb"
      },
      "port": 3500
    },
    "openai": {
      "key": "your private key",
      "model": "model to use",
      "temperature": 0,
      "maxTokens": 1000
    },
    "mongodb": {
      "host": "127.0.0.1",
      "port": 27017,
      "database": "prograimmer"
    },
    "auth": {
      "jwt": {
        "secret": "RANDOM STRING, CHANGE ME",
        "expiration": "7d"
      }
    }
  }

# Ingress values
ingress:
  ingressClassName: nginx
  annotations: []
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/rewrite-target: /
  host: prograimmer-server.local
