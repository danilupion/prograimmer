# Server service values
replicaCount: 1
image:
  repository: prograimmer/server
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3500

config: |
  {
    "environment": "development",
    "server": {
      "bodyParserLimits": {
        "json": "5mb"
      },
      "port": 3500
    },
    "openai": {
      "key": "your private key",
      "model": "model to use",
      "temperature": 0,
      "maxTokens": 1000
    },
    "mongodb": {
      "host": "127.0.0.1",
      "port": 27017,
      "database": "prograimmer"
    },
    "auth": {
      "jwt": {
        "secret": "RANDOM STRING, CHANGE ME",
        "expiration": "7d"
      }
    }
  }

# Gateway API HTTPRoute (the chart's only exposure mechanism since 1.0.0;
# the Ingress template was removed with the ingress-nginx retirement).
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-public
  #     namespace: gateway-public
  parentRefs: []
  hostnames: []
  annotations: {}

# When set, mount the server config (production.json) from this pre-existing
# Secret instead of rendering .Values.config into a ConfigMap - use for
# deployments whose config carries credentials.
existingConfigSecret: ''
